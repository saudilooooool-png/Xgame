<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SwarmCommand — Data Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080d18; --card: #0d1626; --border: #1a2d4a;
      --cyan: #00d4ff; --green: #00ff88; --red: #ff3c3c;
      --text: #c8d8e8; --muted: #4a6a8a;
    }
    body { background: var(--bg); color: var(--text); font-family: monospace; min-height: 100vh; }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; letter-spacing: 3px; color: var(--cyan); }
    #live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green);
                box-shadow: 0 0 8px var(--green); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; padding: 24px 32px 0;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px;
    }
    .card-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
    .card-value { font-size: 36px; font-weight: bold; color: var(--cyan); }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 32px; }
    @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px;
    }
    .chart-title { font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-bottom: 16px; }

    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12px; }
    .bar-label { width: 90px; color: var(--text); text-align: right; flex-shrink: 0; }
    .bar-track { flex: 1; height: 14px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .bar-count { width: 40px; color: var(--muted); font-size: 11px; }

    #wave-chart { display: flex; align-items: flex-end; gap: 4px; height: 100px; }
    .wave-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .wave-bar { width: 100%; background: var(--cyan); border-radius: 3px 3px 0 0; min-height: 2px;
                opacity: 0.7; transition: height 0.5s; }
    .wave-label { font-size: 9px; color: var(--muted); }

    #last-updated { font-size: 10px; color: var(--muted); padding: 8px 32px 24px; }

    a.dl-btn {
      display: inline-block; margin: 0 32px 24px;
      background: rgba(0,20,40,0.9); color: var(--green);
      border: 1px solid rgba(0,255,136,0.3); border-radius: 6px;
      padding: 9px 20px; font-size: 12px; text-decoration: none;
      letter-spacing: 1px; transition: all 0.15s;
    }
    a.dl-btn:hover { background: rgba(0,255,136,0.1); border-color: var(--green); }
  </style>
</head>
<body>
  <header>
    <h1>⬡ SWARMCOMMAND / DATA DASHBOARD</h1>
    <div id="live-dot" title="Live updates every 5s"></div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="card-label">TOTAL SAMPLES</div>
      <div class="card-value" id="stat-total">—</div>
      <div class="card-sub">training records collected</div>
    </div>
    <div class="card">
      <div class="card-label">SESSIONS</div>
      <div class="card-value" id="stat-sessions">—</div>
      <div class="card-sub">unique play sessions</div>
    </div>
    <div class="card">
      <div class="card-label">WITH OUTCOME</div>
      <div class="card-value" id="stat-outcome">—</div>
      <div class="card-sub">labeled (reached / missed)</div>
    </div>
    <div class="card">
      <div class="card-label">SUCCESS RATE</div>
      <div class="card-value" id="stat-rate">—</div>
      <div class="card-sub">reached / total with outcome</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <div class="chart-title">FORMATION USAGE</div>
      <div id="formation-bars"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">OUTCOMES</div>
      <div id="outcome-bars"></div>
    </div>
    <div class="chart-card" style="grid-column: 1 / -1;">
      <div class="chart-title">SAMPLES BY WAVE</div>
      <div id="wave-chart"></div>
    </div>
  </div>

  <div id="last-updated"></div>
  <a class="dl-btn" href="/api/samples" download="swarm_dataset.json">⬇ Download Full Dataset</a>

  <script>
    async function refresh() {
      try {
        const res = await fetch('/api/stats');
        const s = await res.json();
        render(s);
      } catch { /* server offline */ }
    }

    function render(s) {
      document.getElementById('stat-total').textContent = s.totalSamples.toLocaleString();
      document.getElementById('stat-sessions').textContent = s.totalSessions.toLocaleString();
      document.getElementById('stat-outcome').textContent = s.withOutcome.toLocaleString();

      const reached = s.outcomes.reached ?? 0;
      const rate = s.withOutcome > 0 ? Math.round((reached / s.withOutcome) * 100) : 0;
      document.getElementById('stat-rate').textContent = `${rate}%`;

      renderBars('formation-bars', s.formations, '#00d4ff');
      renderBars('outcome-bars', s.outcomes, { reached: '#00ff88', missed: '#ff3c3c', unknown: '#ffaa00' });
      renderWave('wave-chart', s.byWave);

      const d = new Date(s.lastUpdated);
      document.getElementById('last-updated').textContent =
        `Last updated: ${d.toLocaleTimeString()}`;
    }

    function renderBars(id, map, colorOrMap) {
      const el = document.getElementById(id);
      const entries = Object.entries(map).sort((a, b) => b[1] - a[1]);
      const max = Math.max(...entries.map(([, v]) => v), 1);
      el.innerHTML = entries.map(([label, count]) => {
        const pct = Math.round((count / max) * 100);
        const color = typeof colorOrMap === 'string' ? colorOrMap : (colorOrMap[label] ?? '#888');
        return `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
            </div>
            <div class="bar-count">${count}</div>
          </div>`;
      }).join('');
    }

    function renderWave(id, byWave) {
      const el = document.getElementById(id);
      const entries = Object.entries(byWave)
        .map(([w, c]) => [parseInt(w), c])
        .sort((a, b) => a[0] - b[0]);
      if (entries.length === 0) { el.innerHTML = '<span style="color:#4a6a8a;font-size:12px">No data yet</span>'; return; }
      const max = Math.max(...entries.map(([, v]) => v), 1);
      el.innerHTML = entries.map(([wave, count]) => {
        const h = Math.max(4, Math.round((count / max) * 90));
        return `<div class="wave-col">
          <div class="wave-bar" style="height:${h}px" title="${count} samples"></div>
          <div class="wave-label">W${wave}</div>
        </div>`;
      }).join('');
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
